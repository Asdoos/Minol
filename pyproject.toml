[project]
name = "minol-energy"
version = "0.8.0"
description = "Home Assistant integration for the Minol tenant energy portal"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff.lint]
# Pinned explicitly: this was ruff's default set until 0.16 widened it, which
# turned an unpinned `pip install ruff` in CI into a moving target.  Widen on
# purpose, not because a release did it for us.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
